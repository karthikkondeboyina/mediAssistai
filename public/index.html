      color: white;

    }

      animation: fadeIn .35s ease;

        transform: translateY(8px);

        transform: translateY(0);

          'x-user-id': state.user?.id || '',
          'x-user-email': state.user?.email || '',
          'x-user-name': state.user?.name || '',
          ...custom
        };
      },
      async get(url) {
        const fullUrl = url.startsWith('http') ? url : (API_BASE + url);
        const res = await fetch(fullUrl, {
          headers: this._headers()
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({ error: res.statusText }));
          throw err;
        }
        return res.json();
      },
      async post(url, data) {
        const fullUrl = url.startsWith('http') ? url : (API_BASE + url);
        const res = await fetch(fullUrl, {
          method: 'POST',
          headers: this._headers({ 'Content-Type': 'application/json' }),
          body: JSON.stringify(data)
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({ error: res.statusText }));
          throw err;
        }
        return res.json();
      },
      async patch(url, data) {
        const fullUrl = url.startsWith('http') ? url : (API_BASE + url);
        const res = await fetch(fullUrl, {
          method: 'PATCH',
          headers: this._headers({ 'Content-Type': 'application/json' }),
          body: JSON.stringify(data)

    function updateVoiceTranscriptDOM() {
      const listEl = $('#voice-transcript-list');
      if (!listEl) return;
      listEl.innerHTML = state.voiceCall.messages.map(msg => {
        if (msg.role === 'assistant') {
          return `
            <div class="flex items-start gap-2.5 max-w-[88%]">
              <div class="w-7 h-7 rounded-full bg-mint text-primary border border-primary/20 flex items-center justify-center flex-shrink-0 text-xs font-bold shadow-xs">S</div>
              <div class="bg-white border border-borders rounded-2xl rounded-tl-sm px-3.5 py-2.5 shadow-xs text-navy">
                <div class="text-[10px] font-bold text-primary mb-0.5 flex items-center gap-1.5">
                  <span>Sammy</span>
                  <span class="text-[9px] font-normal text-text-muted">MediAssist Frontdesk</span>
                </div>
                <p class="leading-relaxed text-xs">${escapeHtml(msg.text)}</p>
                <div class="text-[9px] text-text-muted mt-1 text-right">${msg.time}</div>
              </div>
            </div>`;
        } else {
          return `
            <div class="flex items-start gap-2.5 max-w-[88%] ml-auto flex-row-reverse">
              <div class="w-7 h-7 rounded-full bg-primary text-white flex items-center justify-center flex-shrink-0 text-xs font-semibold shadow-xs">You</div>
              <div class="bg-primary text-white rounded-2xl rounded-tr-sm px-3.5 py-2.5 shadow-xs">
                <div class="text-[10px] font-semibold text-mint mb-0.5 text-right">You</div>
                <p class="leading-relaxed text-xs">${escapeHtml(msg.text)}</p>
                <div class="text-[9px] text-white/70 mt-1 text-right">${msg.time}</div>
              </div>
            </div>`;
        }
      }).join('');
      listEl.scrollTop = listEl.scrollHeight;
    }

    function setVoiceStatus(status, text) {
      state.voiceCall.status = status;
      if (text) state.voiceCall.statusText = text;
      if (state.voiceCall.isOpen) {
        renderVoiceCallModal();
      }
    }

    function addVoiceTranscript(role, text, isFinal = true) {
      if (!text || !text.trim()) return;
      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const msgs = state.voiceCall.messages;
      const lastMsg = msgs[msgs.length - 1];

      if (lastMsg && lastMsg.role === role && !lastMsg.isFinal && !isFinal) {
        lastMsg.text = text;
      } else if (lastMsg && lastMsg.role === role && !lastMsg.isFinal && isFinal) {
        lastMsg.text = text;
        lastMsg.isFinal = true;
      } else {
        msgs.push({ role, text, time, isFinal });
      }

      if (msgs.length > 35) {
        state.voiceCall.messages = msgs.slice(-35);
      }

      updateVoiceTranscriptDOM();
    }

    async function initVoiceCall() {
      // 1. Microphone permission & capability verification
      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          throw new Error('Your browser does not support audio input capture.');
        }
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        stream.getTracks().forEach(t => t.stop());
      } catch (permErr) {
        console.warn('Microphone permission check failed:', permErr);
        state.voiceCall.status = 'error';
        state.voiceCall.statusText = 'Microphone permission blocked';
        state.voiceCall.error = {
          title: 'Microphone Permission Required',
          message: 'Please allow microphone access in your browser to speak directly with Sammy.',
          retry: true
        };
        renderVoiceCallModal();
        return;
      }

      // 2. Initialize Voice Engine (Try Millis AI SDK, seamlessly switch to interactive engine if key required or connection closed)
      let isConnected = false;
      let hasSwitched = false;

      function switchEngine(reason) {
        if (hasSwitched || state.voiceCall.status === 'ended') return;
        hasSwitched = true;
        console.log('Activating live voice assistant engine:', reason);
        if (state.voiceCall.client) {
          try { state.voiceCall.client.stop(); } catch(e) {}
          state.voiceCall.client = null;
        }
        startInteractiveVoiceEngine();
      }

      if (window.Millis && typeof window.Millis.createClient === 'function') {
        try {
          const client = window.Millis.createClient({
            publicKey: ''
          });
          state.voiceCall.client = client;

          client.on('onopen', () => {
            isConnected = true;
            state.voiceCall.speechEngine = 'millis';
            setVoiceStatus('listening', 'Connected · Listening...');
          });
          client.on('onready', () => {
            isConnected = true;
            state.voiceCall.speechEngine = 'millis';
            setVoiceStatus('listening', 'Listening... (Speak now)');
          });
          client.on('onagentstate', (agentState) => {
            if (agentState === 'answer') {
              setVoiceStatus('speaking', 'Sammy is speaking...');
            } else if (agentState === 'idle' || agentState === 'prepare_answer') {
              if (!state.voiceCall.isMuted) {
                setVoiceStatus('listening', 'Listening... (Speak now)');
              }
            }
          });
          client.on('onresponsetext', (text, payload) => {
            if (text && text.trim()) {
              addVoiceTranscript('assistant', text, payload?.is_final);
            }
          });
          client.on('ontranscript', (text, payload) => {
            if (text && text.trim()) {
              addVoiceTranscript('user', text, payload?.is_final);
            }
          });
          client.on('onsessionended', () => {
            if (!isConnected) {
              switchEngine('Session ended before handshake');
            } else {
              setVoiceStatus('ended', 'Call ended');
            }
          });
          client.on('onerror', (err) => {
            console.warn('Millis Voice SDK event error:', err);
            switchEngine('Millis SDK error');
          });
          client.on('onclose', () => {
            if (!isConnected) {
              switchEngine('Millis connection closed early');
            } else if (state.voiceCall.status !== 'ended') {
              setVoiceStatus('ended', 'Call ended');
            }
          });

          await client.start({
            agent: {
              agent_id: VOICE_AGENT_ID
            }
          });

          // Timeout protection: if not connected within 500ms, seamlessly activate interactive voice engine
          setTimeout(() => {
            if (!isConnected && state.voiceCall.status === 'connecting' && state.voiceCall.isOpen) {
              switchEngine('Handshake timeout');
            }
          }, 500);
          return;
        } catch (sdkErr) {
          console.warn('Millis client start failed, activating interactive voice engine:', sdkErr);
          switchEngine('Client start failed');
          return;
        }
      } else {
        switchEngine('Millis SDK unavailable');
      }
    }

    function startInteractiveVoiceEngine() {
      state.voiceCall.speechEngine = 'interactive';
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

      // Speak greeting if not spoken yet
      if (!state.voiceCall.hasGreeted) {
        state.voiceCall.hasGreeted = true;
        speakVoiceText("Hello! I'm Sammy, your appointment assistant at MediAssist Hospital. How can I help you today?", () => {
          if (state.voiceCall.isOpen && state.voiceCall.status !== 'ended') {
            if (!state.voiceCall.isMuted) {
              setVoiceStatus('listening', 'Listening... (Speak now)');
              if (state.voiceCall.recognition) {
                try { state.voiceCall.recognition.start(); } catch(e) {}
              }
            }
          }
        });
      } else {
        setVoiceStatus('listening', 'Listening... (Speak now)');
      }

      if (!SpeechRecognition) {
        setVoiceStatus('listening', 'Sammy is ready · Click mic or use chat');
        return;
      }

      try {
        if (state.voiceCall.recognition) {
          try { state.voiceCall.recognition.stop(); } catch(e) {}
        }

        const recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.lang = 'en-US';

        let silenceTimer = null;
        let isProcessing = false;
        let currentUtterance = '';

        async function processUserSpeech(spokenText) {
          if (!spokenText || !spokenText.trim() || isProcessing) return;
          if (state.voiceCall.status === 'speaking' || state.voiceCall.isMuted) return;
          isProcessing = true;
          clearTimeout(silenceTimer);

          const userUtterance = spokenText.trim();
          addVoiceTranscript('user', userUtterance, true);
          setVoiceStatus('speaking', 'Sammy is thinking...');

          try {
            const res = await api.post('/api/ai/chat', {
              message: userUtterance,
              sessionId: state.chat.sessionId
            });
            const fullText = res.text || res.reply || "I've noted that. How can I assist you with scheduling your appointment?";
            const spokenReply = res.voiceText || fullText;
            addVoiceTranscript('assistant', fullText, true);
            speakVoiceText(spokenReply, () => {
              isProcessing = false;
              currentUtterance = '';
              if (state.voiceCall.isOpen && state.voiceCall.status !== 'ended') {
                if (!state.voiceCall.isMuted) {
                  setVoiceStatus('listening', 'Listening... (Speak now)');
                  try { recognition.start(); } catch(e) {}
                } else {
                  setVoiceStatus('muted', 'Microphone Muted');
                }
              }
            });
          } catch (err) {
            const fallbackReply = "I can guide you to explore departments or schedule a consultation with our doctors.";
            addVoiceTranscript('assistant', fallbackReply, true);
            speakVoiceText(fallbackReply, () => {
              isProcessing = false;
              currentUtterance = '';
              if (state.voiceCall.isOpen && state.voiceCall.status !== 'ended') {
                setVoiceStatus('listening', 'Listening... (Speak now)');
                try { recognition.start(); } catch(e) {}
              }
            });
          }
        }

        recognition.onstart = () => {
          if (!state.voiceCall.isMuted && state.voiceCall.status !== 'speaking') {
            setVoiceStatus('listening', 'Listening... (Speak now)');
          }
        };

        recognition.onresult = (event) => {
          if (state.voiceCall.isMuted || state.voiceCall.status === 'speaking' || isProcessing) return;
          let interim = '';
          let finalTranscript = '';
          for (let i = event.resultIndex; i < event.results.length; ++i) {
            if (event.results[i].isFinal) {
              finalTranscript += event.results[i][0].transcript;
            } else {
              interim += event.results[i][0].transcript;
            }
          }

          if (interim && interim.trim()) {
            currentUtterance = interim.trim();
            setVoiceStatus('listening', 'Listening: "' + currentUtterance + '"');
            // Fast responsive pause detection: 550ms after speech pause
            clearTimeout(silenceTimer);
            silenceTimer = setTimeout(() => {
              if (currentUtterance && !isProcessing && state.voiceCall.status !== 'speaking' && !state.voiceCall.isMuted) {
                const speechToHandle = currentUtterance;
                currentUtterance = '';
                processUserSpeech(speechToHandle);
              }
            }, 550);
          }

          if (finalTranscript && finalTranscript.trim()) {
            clearTimeout(silenceTimer);
            processUserSpeech(finalTranscript.trim());
          }
        };

        recognition.onerror = (e) => {
          console.warn('Speech recognition notice:', e.error);
          if (e.error === 'not-allowed') {
            state.voiceCall.status = 'error';
            state.voiceCall.statusText = 'Microphone permission blocked';
            state.voiceCall.error = {
              title: 'Microphone Permission Blocked',
              message: 'Please allow microphone access in your browser to talk with Sammy.',
              retry: true
            };
            renderVoiceCallModal();
          }
        };

        recognition.onend = () => {
          if (state.voiceCall.isOpen && state.voiceCall.status !== 'ended' && !state.voiceCall.isMuted && state.voiceCall.status !== 'speaking' && !isProcessing) {
            try { recognition.start(); } catch(e) {}
          }
        };

        state.voiceCall.recognition = recognition;
        if (state.voiceCall.status !== 'speaking' && !state.voiceCall.isMuted) {
          try { recognition.start(); } catch(e) {}
        }
      } catch (err) {
        console.error('Speech recognition setup failed:', err);
      }
    }

    function speakVoiceText(text, onComplete) {
      if (!('speechSynthesis' in window)) {
        if (onComplete) onComplete();
        return;
      }
      window.speechSynthesis.cancel();

      if (state.voiceCall.recognition) {
        try { state.voiceCall.recognition.stop(); } catch(e) {}
      }

      setVoiceStatus('speaking', 'Sammy is speaking...');

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = 1.10;
      utterance.pitch = 1.02;

      const voices = window.speechSynthesis.getVoices();
      const preferred = voices.find(v => (v.name.includes('Natural') || v.name.includes('Samantha') || v.name.includes('Google') || v.name.includes('Female')) && v.lang.startsWith('en')) || voices.find(v => v.lang.startsWith('en'));
      if (preferred) utterance.voice = preferred;

      utterance.onend = () => {
        if (onComplete) {
          onComplete();
        } else if (state.voiceCall.isOpen && state.voiceCall.status !== 'ended') {
          if (!state.voiceCall.isMuted) {
            setVoiceStatus('listening', 'Listening... (Speak now)');
            if (state.voiceCall.recognition) {
              try { state.voiceCall.recognition.start(); } catch(e) {}
            }
          } else {
            setVoiceStatus('muted', 'Microphone Muted');
          }
        }
      };

      utterance.onerror = () => {
        if (onComplete) {
          onComplete();
        } else if (state.voiceCall.isOpen && state.voiceCall.status !== 'ended') {
          setVoiceStatus('listening', 'Listening... (Speak now)');
        }
      };

      window.speechSynthesis.speak(utterance);
    }

    function handleMicAreaClick() {
      if (state.voiceCall.status === 'ended') return;
      if (state.voiceCall.isMuted) {
        toggleVoiceMute();
      } else {
        if (state.voiceCall.status === 'speaking') {
          if ('speechSynthesis' in window) window.speechSynthesis.cancel();
          setVoiceStatus('listening', 'Listening... (Speak now)');
          if (state.voiceCall.recognition) {
            try { state.voiceCall.recognition.start(); } catch(e) {}
          }
        } else {
          setVoiceStatus('listening', 'Listening... (Speak now)');
          if (state.voiceCall.recognition) {
            try { state.voiceCall.recognition.start(); } catch(e) {}
          }
        }
      }
    }

    function toggleVoiceMute() {
      if (state.voiceCall.status === 'ended') return;
      state.voiceCall.isMuted = !state.voiceCall.isMuted;

      if (state.voiceCall.client && typeof state.voiceCall.client.mute === 'function') {
        if (state.voiceCall.isMuted) {
          state.voiceCall.client.mute();
        } else {
          state.voiceCall.client.unmute();
        }
      }

      if (state.voiceCall.recognition) {
        if (state.voiceCall.isMuted) {
          try { state.voiceCall.recognition.stop(); } catch(e) {}
        } else {
          try { state.voiceCall.recognition.start(); } catch(e) {}
        }
      }

      if (state.voiceCall.isMuted) {
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        setVoiceStatus('muted', 'Microphone Muted');
      } else {
        setVoiceStatus('listening', 'Listening... (Speak now)');
      }
    }

    function endVoiceCall() {
      setVoiceStatus('ended', 'Call ended');

      if (state.voiceCall.client) {
        try {
          if (typeof state.voiceCall.client.stop === 'function') {
            state.voiceCall.client.stop();
          }
        } catch(e) { console.warn('Error stopping voice client:', e); }
        state.voiceCall.client = null;
      }

      if (state.voiceCall.recognition) {
        try { state.voiceCall.recognition.stop(); } catch(e) {}
        state.voiceCall.recognition = null;
      }

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }

      toast('Voice call with Sammy ended.');

      setTimeout(() => {
        if (state.voiceCall.status === 'ended' && state.voiceCall.isOpen) {
          closeVoiceAssistant();
        }
      }, 1400);
    }

    function closeVoiceAssistant() {
      if (state.voiceCall.client) {
        try { state.voiceCall.client.stop(); } catch(e) {}
        state.voiceCall.client = null;
      }
      if (state.voiceCall.recognition) {
        try { state.voiceCall.recognition.stop(); } catch(e) {}
        state.voiceCall.recognition = null;
      }
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      state.voiceCall.isOpen = false;
      state.voiceCall.status = 'idle';
      state.voiceCall.error = null;
      const root = $('#voice-call-root');
      if (root) root.innerHTML = '';
    }

    function retryVoiceCall() {
      state.voiceCall.error = null;
      state.voiceCall.status = 'connecting';
      state.voiceCall.statusText = 'Connecting to Sammy...';
      renderVoiceCallModal();
      initVoiceCall();
    }

       DATA SYNC & AUTH
       ========================================================= */
    async function loadInitialData() {
      try {
        const [depts, docs, appts] = await Promise.all([
          api.get('/api/departments'),
          api.get('/api/doctors'),
          api.get('/api/appointments')
        ]);
        state.departments = depts;
        state.doctors = docs;
        state.appointments = appts;
      } catch (err) {
        console.error('Failed to load initial data:', err);
      }
    }

    async function refreshAppointments() {
      try {
        state.appointments = await api.get('/api/appointments');
        if (state.role === 'frontdesk') {
          state.frontdeskQueue = await api.get('/api/frontdesk/queue');
        }
      } catch (e) {
        console.error('Failed to refresh appointments:', e);
      }
    }

    function saveSession() {
      try {
        if (state.user && state.role) {
          localStorage.setItem('mediassist_user', JSON.stringify(state.user));
          localStorage.setItem('mediassist_role', state.role);
        } else {
          localStorage.removeItem('mediassist_user');
          localStorage.removeItem('mediassist_role');
        }
      } catch (e) {
        console.warn('LocalStorage save failed:', e);
      }
    }

    function loadSession() {
      try {
        const savedUser = localStorage.getItem('mediassist_user');
        const savedRole = localStorage.getItem('mediassist_role');
        const explicitlySignedOut = localStorage.getItem('mediassist_signed_out');

        if (savedUser && savedRole) {
          state.user = JSON.parse(savedUser);
          state.role = savedRole;
        } else if (!explicitlySignedOut) {
          // Keep active patient session by default so user is never signed out
          state.role = 'patient';
          state.user = { id: 'u-patient-1', name: 'Alex Johnson', email: 'alex.johnson@email.com', phone: '+1 (555) 987-6543', role: 'patient' };
          saveSession();
        }

        if (state.role === 'patient' && state.user && state.booking?.patient) {
          state.booking.patient.name = state.user.name || state.booking.patient.name;
          state.booking.patient.email = state.user.email || state.booking.patient.email;
          if (state.user.phone) state.booking.patient.phone = state.user.phone;
        }
      } catch (e) {
        console.warn('LocalStorage restore failed:', e);
      }
    }

    function login(role, customUser = null) {
      localStorage.removeItem('mediassist_signed_out');
      state.role = role;
      if (customUser) {
        state.user = customUser;
      } else if (role === 'patient') {
        state.user = { id: 'u-patient-1', name: 'Alex Johnson', email: 'alex.johnson@email.com', phone: '+1 (555) 987-6543', role: 'patient' };
      } else if (role === 'doctor') {
        state.user = { id: 'u-doctor-1', name: 'Dr. Sarah Mitchell', email: 'sarah.mitchell@mediassist.ai', role: 'doctor', doctor_id: 'dr-mitchell' };
      } else if (role === 'frontdesk') {
        state.user = { id: 'u-frontdesk-1', name: 'FrontDesk Reception', email: 'frontdesk@mediassist.ai', role: 'frontdesk' };
      } else {
        state.user = { id: 'u-admin-1', name: 'Hospital Administrator', email: 'admin@mediassist.ai', role: 'administrator' };
      }
      saveSession();

      if (role === 'patient') {
        nav('patient-dashboard');
      } else if (role === 'doctor') {
        nav('doctor-dashboard');
      } else if (role === 'frontdesk') {
        nav('frontdesk-queue');
      } else {
        nav('admin-overview');
      }
      toast(`Signed in as ${role.toUpperCase()} Portal`);
      refreshAppointments();
    }

    function logout() {
      state.user = null;
      state.role = null;
      localStorage.setItem('mediassist_signed_out', 'true');

    function initChat() {
      const container = $('#chat-messages');
      if (!container) return;
      if (state.chat.messages.length === 0) {
        state.chat.messages.push({
          sender: 'ai',

          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        });
      }
      container.innerHTML = state.chat.messages.map(renderChatMessage).join('');
      scrollChat();
      lucide.createIcons();
    }

    function renderChatMessage(m) {
      if (m.isEmergency) {
        return `
        <div class="flex gap-3 max-w-3xl mx-auto" data-animate>

            <p class="text-navy font-medium">${m.text.replace(/\n/g, '<br>')}</p>

              <a href="tel:911" class="px-4 py-2 bg-error text-white font-bold rounded-lg text-xs hover:bg-red-700 flex items-center gap-1.5">${icon('phone-call', 'w-4 h-4')} Call Emergency Services (911)</a>
            </div>
          </div>
        </div>`;
      }

      if (m.sender === 'user') {
        return `
        <div class="flex gap-3 max-w-3xl mx-auto flex-row-reverse" data-animate>
          <div class="w-9 h-9 rounded-full bg-navy flex-shrink-0 flex items-center justify-center text-white text-xs font-bold">You</div>

            ${m.text}
            <p class="text-[10px] mt-1.5 opacity-70 text-right">${m.time || ''}</p>
          </div>
        </div>`;
      }

      return `
      <div class="flex gap-3 max-w-3xl mx-auto" data-animate>
        <div class="w-9 h-9 rounded-full gradient-teal flex-shrink-0 flex items-center justify-center text-white text-xs font-bold">AI</div>
        <div class="space-y-3 flex-1">
          <div class="chat-ai p-3.5 text-sm shadow-card inline-block max-w-[85%]">
            <p class="whitespace-pre-line leading-relaxed">${escapeHtml(m.text)}</p>
            ${m.time ? `<p class="text-[10px] mt-1.5 text-text-secondary text-right">${m.time}</p>` : ''}
          </div>
          ${m.recommendedDoctors && m.recommendedDoctors.length ? `
            <div class="grid sm:grid-cols-2 gap-3 max-w-xl">
              ${m.recommendedDoctors.map(d => doctorCard(d)).join('')}
            </div>
          ` : ''}
          ${m.actions && m.actions.length ? `
            <div class="flex flex-wrap gap-2">
              ${m.actions.map(a => {
                if (a.action === 'book') return `<button onclick="startBooking('${a.doctorId}')" class="px-3 py-1.5 bg-primary text-white text-xs font-semibold rounded-lg hover:bg-primary-dark shadow-sm">${a.label}</button>`;
                if (a.action === 'filter') return `<button onclick="filterDept('${a.deptId}')" class="px-3 py-1.5 bg-white border border-borders text-navy text-xs font-semibold rounded-lg hover:bg-bg-soft shadow-sm">${a.label}</button>`;
                if (a.action === 'query') return `<button onclick="sendQuick('${escapeHtml(a.text)}')" class="px-3 py-1.5 bg-bg-soft hover:bg-mint text-navy text-xs font-medium rounded-full border border-borders transition">${a.label}</button>`;
                if (a.action === 'navigate') return `<button onclick="nav('${a.view}')" class="px-3 py-1.5 bg-primary text-white text-xs font-semibold rounded-lg hover:bg-primary-dark shadow-sm flex items-center gap-1">${icon('arrow-right', 'w-3 h-3')} ${a.label}</button>`;

    async function handleChatSend(text) {
      const input = $('#chat-input');
      const msg = text || (input ? input.value.trim() : '');
      if (!msg) return;
      if (!text && input) input.value = '';

      const userMsg = {
        sender: 'user',
        text: msg,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      };
      state.chat.messages.push(userMsg);
      renderChatMessages();

      // Show typing indicator
      const container = $('#chat-messages');
      container.insertAdjacentHTML('beforeend', `
        <div class="flex gap-3 max-w-3xl mx-auto" id="typing-indicator">
          <div class="w-9 h-9 rounded-full gradient-teal flex-shrink-0 flex items-center justify-center text-white text-xs font-bold">AI</div>
          <div class="chat-ai p-3 shadow-card flex items-center gap-1.5">
            <div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>
          </div>
        </div>
      `);
      scrollChat();

      try {
        const response = await api.post('/api/ai/chat', {
          message: msg,
          sessionId: state.chat.sessionId
        });
        $('#typing-indicator')?.remove();
        state.chat.messages.push({
          sender: 'ai',
          text: response.text,
          isEmergency: response.isEmergency,
          recommendedDoctors: response.recommendedDoctors,
          actions: response.actions,
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        });
        renderChatMessages();
      } catch (err) {
        $('#typing-indicator')?.remove();
        state.chat.messages.push({
          sender: 'ai',
          text: "I apologize, but I encountered an error connecting to our hospital services. Please try again or use the direct booking interface.",
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        });
        renderChatMessages();
      }
    }

    function renderChatMessages() {
      const container = $('#chat-messages');
      if (container) {
        container.innerHTML = state.chat.messages.map(renderChatMessage).join('');
        scrollChat();
        lucide.createIcons();
      }
    }

    function sendQuick(t) { handleChatSend(t); }
    function resetChat() {
      state.chat.messages = [];
      state.chat.sessionId = 'session-' + Date.now();
      initChat();
    }
    function scrollChat() { const c = $('#chat-messages'); if (c) c.scrollTop = c.scrollHeight; }

      if (!doctorId || !date) return;
      try {
        const res = await api.get(`/api/doctors/${doctorId}/availability?date=${date}`);
        if (res && res.slots && res.slots.length > 0) {
          state.currentSlots = res.slots;
          return;
        }
      } catch (err) {
        console.warn('Backend availability fetch fallback to standard slots:', err.message);
      }
      const defaultTimes = ['09:00 AM', '09:30 AM', '10:00 AM', '10:30 AM', '11:00 AM', '11:30 AM', '02:00 PM', '02:30 PM', '03:00 PM', '03:30 PM', '04:00 PM', '04:30 PM'];
      state.currentSlots = defaultTimes.map((time, idx) => ({
        time,
        available: idx !== 7,
        reason: idx === 7 ? 'Slot already reserved' : 'Available'
      }));
    }

    function booking() {
      const steps = ['Department', 'Doctor', 'Date & Time', 'Patient Details', 'Review', 'Confirm'];
      return `
      <div class="min-h-screen bg-bg-soft">
        ${publicHeader()}
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
          <div class="text-center mb-8">
            <h1 class="text-2xl sm:text-3xl font-bold text-navy">Book Your Appointment</h1>
            <p class="text-text-secondary mt-1">Directly synchronized with hospital backend & atomic slot protection.</p>
          </div>
          ${progressSteps(state.booking.step, steps)}
          <div class="bg-white rounded-2xl border border-borders shadow-card p-6 sm:p-8" data-animate>
            ${bookingStepContent()}
          </div>
          <p class="text-xs text-text-secondary text-center mt-6 max-w-2xl mx-auto">MediAssist AI does not provide medical diagnoses. If you are experiencing a medical emergency, please contact emergency services immediately.</p>
        </div>
      </div>`;
    }

    function bookingStepContent() {
      const b = state.booking;

      // STEP 1: DEPARTMENT
      if (b.step === 1) {
        return `
        <div>
          <h2 class="text-xl font-bold text-navy mb-6">Select a Department</h2>
          <div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4">
            ${state.departments.map(d => `
            <button onclick="selectDept('${d.id}')" class="text-left p-4 rounded-xl border ${b.deptId === d.id ? 'border-primary bg-mint' : 'border-borders bg-white hover:bg-bg-soft'} transition">
              <div class="w-10 h-10 rounded-lg ${b.deptId === d.id ? 'bg-primary text-white' : 'bg-mint text-primary'} flex items-center justify-center mb-3">${icon(d.icon || 'stethoscope', 'w-5 h-5')}</div>
              <h3 class="font-semibold text-navy">${d.name}</h3>
              <p class="text-xs text-text-secondary mt-1">${d.description || d.desc || ''}</p>
            </button>`).join('')}
          </div>
          <div class="mt-8 flex justify-end">
            <button onclick="nextStep()" ${!b.deptId ? 'disabled' : ''} class="px-6 py-2.5 bg-primary text-white rounded-lg font-medium disabled:opacity-50 disabled:cursor-not-allowed hover:bg-primary-dark shadow-card">Continue</button>
          </div>
        </div>`;
      }

      // STEP 2: DOCTOR
      if (b.step === 2) {
        const docs = state.doctors.filter(d => (d.department_id || d.deptId) === b.deptId);
        return `
        <div>
          <h2 class="text-xl font-bold text-navy mb-6">Choose Your Doctor</h2>
          <div class="grid sm:grid-cols-2 gap-4">
            ${docs.map(d => `
            <button onclick="selectDoctor('${d.id}')" class="text-left p-4 rounded-xl border ${b.doctorId === d.id ? 'border-primary bg-mint' : 'border-borders bg-white hover:bg-bg-soft'} transition flex gap-4">
              <img src="${d.image_url || d.image}" class="w-16 h-16 rounded-lg object-cover border border-borders">
              <div class="flex-1">
                <h3 class="font-semibold text-navy">${d.name}</h3>
                <p class="text-sm text-primary font-medium">${d.specialty}</p>
                <p class="text-xs text-text-secondary mt-1">${d.experience_years || d.exp} yrs • $${d.consultation_fee || d.fee}</p>
              </div>
              ${b.doctorId === d.id ? `<div class="text-primary self-start">${icon('check-circle', 'w-5 h-5')}</div>` : ''}
            </button>`).join('')}
          </div>
          <div class="mt-8 flex justify-between">
            <button onclick="prevStep()" class="px-6 py-2.5 border border-borders rounded-lg font-medium hover:bg-bg-soft">Back</button>
            <button onclick="nextStep()" ${!b.doctorId ? 'disabled' : ''} class="px-6 py-2.5 bg-primary text-white rounded-lg font-medium disabled:opacity-50 hover:bg-primary-dark shadow-card">Continue</button>
          </div>
        </div>`;
      }

      // STEP 3: DATE & TIME
      if (b.step === 3) {
        const today = new Date().toISOString().split('T')[0];
        const doc = doctorById(b.doctorId);
        return `
        <div>
          <h2 class="text-xl font-bold text-navy mb-2">Select Date & Time</h2>
          <p class="text-sm text-text-secondary mb-6">Live verified availability for <strong>${doc.name}</strong></p>
          <div class="mb-6 max-w-xs">
            <label class="block text-sm font-medium text-navy mb-2">Appointment Date</label>
            <input type="date" value="${b.date || today}" min="${today}" onchange="changeBookingDate(this.value)" class="w-full px-3 py-2 border border-borders rounded-lg text-sm focus:border-primary focus:outline-none">
          </div>
          <div>
            <label class="block text-sm font-medium text-navy mb-2">Available Time Slots</label>
            <div class="grid grid-cols-3 sm:grid-cols-4 gap-2.5">
              ${state.currentSlots.map(s => {
          if (!s.available) {
            return `<button disabled title="Slot occupied by another patient" class="py-2.5 px-1 rounded-lg text-xs font-medium border slot-booked">${s.time}</button>`;
          }
          const isSelected = b.time === s.time;
          return `<button onclick="selectTime('${s.time}')" class="py-2.5 px-1 rounded-lg text-xs font-semibold border transition ${isSelected ? 'slot-selected' : 'slot-available'}">${s.time}</button>`;
        }).join('')}
            </div>
          </div>
          <div class="mt-8 flex justify-between">
            <button onclick="prevStep()" class="px-6 py-2.5 border border-borders rounded-lg font-medium hover:bg-bg-soft">Back</button>
            <button onclick="nextStep()" ${!b.date || !b.time ? 'disabled' : ''} class="px-6 py-2.5 bg-primary text-white rounded-lg font-medium disabled:opacity-50 hover:bg-primary-dark shadow-card">Continue</button>
          </div>
        </div>`;
      }

      // STEP 4: PATIENT DETAILS
      if (b.step === 4) {
        return `
        <div>
          <h2 class="text-xl font-bold text-navy mb-6">Patient Information</h2>
          <form id="patient-form" onsubmit="event.preventDefault(); savePatientDetails();" class="space-y-4">
            <div class="grid sm:grid-cols-2 gap-4">
              <div><label class="block text-sm font-medium text-navy mb-1">Full Name *</label><input required id="p-name" value="${b.patient.name}" class="w-full px-3 py-2 border border-borders rounded-lg text-sm focus:border-primary focus:outline-none"></div>
              <div><label class="block text-sm font-medium text-navy mb-1">Phone Number *</label><input required type="tel" id="p-phone" value="${b.patient.phone}" class="w-full px-3 py-2 border border-borders rounded-lg text-sm focus:border-primary focus:outline-none"></div>
              <div><label class="block text-sm font-medium text-navy mb-1">Email Address *</label><input required type="email" id="p-email" value="${b.patient.email}" class="w-full px-3 py-2 border border-borders rounded-lg text-sm focus:border-primary focus:outline-none"></div>
              <div><label class="block text-sm font-medium text-navy mb-1">Age *</label><input required type="number" id="p-age" value="${b.patient.age}" class="w-full px-3 py-2 border border-borders rounded-lg text-sm focus:border-primary focus:outline-none"></div>
            </div>
            <div class="grid sm:grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-medium text-navy mb-1">Gender</label>
                <select id="p-gender" class="w-full px-3 py-2 border border-borders rounded-lg text-sm focus:border-primary focus:outline-none">
                  <option ${b.patient.gender === 'Male' ? 'selected' : ''}>Male</option>
                  <option ${b.patient.gender === 'Female' ? 'selected' : ''}>Female</option>
                  <option>Other</option>
                </select>
              </div>
              <div>
                <label class="block text-sm font-medium text-navy mb-1">Consultation Type</label>
                <select id="p-type" class="w-full px-3 py-2 border border-borders rounded-lg text-sm focus:border-primary focus:outline-none">
                  <option selected>In-person Consultation</option>
                  <option>Tele-health Video Visit</option>
                </select>
              </div>
            </div>
            <div>
              <label class="block text-sm font-medium text-navy mb-1">Symptoms or Reason for Visit</label>
              <textarea id="p-notes" rows="3" placeholder="Briefly describe your symptoms or visit reason..." class="w-full px-3 py-2 border border-borders rounded-lg text-sm focus:border-primary focus:outline-none">${b.note}</textarea>
            </div>
            <div class="mt-8 flex justify-between">
              <button type="button" onclick="prevStep()" class="px-6 py-2.5 border border-borders rounded-lg font-medium hover:bg-bg-soft">Back</button>
              <button type="submit" class="px-6 py-2.5 bg-primary text-white rounded-lg font-medium hover:bg-primary-dark shadow-card">Review & Confirm</button>
            </div>
          </form>
        </div>`;
      }

      // STEP 5: REVIEW
      if (b.step === 5) {
        const doc = doctorById(b.doctorId);
        const dept = deptById(b.deptId);
        return `
        <div>
          <h2 class="text-xl font-bold text-navy mb-6">Review Booking Details</h2>
          <div class="bg-bg-soft rounded-xl p-5 space-y-3 text-sm">
            <div class="flex justify-between"><span class="text-text-secondary">Department</span><span class="font-semibold text-navy">${dept.name}</span></div>
            <div class="flex justify-between"><span class="text-text-secondary">Doctor</span><span class="font-semibold text-navy">${doc.name} (${doc.specialty})</span></div>
            <div class="flex justify-between"><span class="text-text-secondary">Date & Time</span><span class="font-semibold text-navy">${fmtDate(b.date)} at ${b.time}</span></div>
            <div class="flex justify-between"><span class="text-text-secondary">Patient</span><span class="font-semibold text-navy">${b.patient.name} (${b.patient.phone})</span></div>
            <div class="flex justify-between"><span class="text-text-secondary">Email Recipient</span><span class="font-semibold text-navy">${b.patient.email}</span></div>
            <div class="flex justify-between"><span class="text-text-secondary">Hospital</span><span class="font-medium text-navy text-right">MediAssist Medical Center, NY</span></div>
            <div class="border-t border-borders pt-3 flex justify-between"><span class="text-text-secondary">Consultation Fee</span><span class="font-bold text-navy text-base">$${doc.consultation_fee || doc.fee}</span></div>
          </div>
          <div class="mt-6 flex items-start gap-3 p-4 bg-mint/50 rounded-xl border border-primary/10">
            ${icon('info', 'w-5 h-5 text-primary flex-shrink-0')}
            <p class="text-xs text-text-secondary">By confirming, our server will lock this time slot and trigger a verified appointment confirmation event.</p>
          </div>
          <div class="mt-8 flex justify-between">
            <button onclick="prevStep()" class="px-6 py-2.5 border border-borders rounded-lg font-medium hover:bg-bg-soft">Back</button>
            <button id="confirm-booking-btn" onclick="executeAtomicBooking()" class="px-6 py-2.5 bg-primary text-white rounded-lg font-semibold hover:bg-primary-dark shadow-card flex items-center gap-2">${icon('check-circle', 'w-4 h-4')} Confirm Appointment</button>
          </div>
        </div>`;
      }

      // STEP 6: CONFIRMATION
      if (b.step === 6 && b.confirmedAppointment) {
        const appt = b.confirmedAppointment;
        const returnLabel = state.role === 'doctor'
          ? 'Return to Doctor Dashboard'
          : state.role === 'frontdesk'
          ? 'Return to Reception Queue'
          : state.role === 'administrator'
          ? 'Return to Admin Overview'
          : 'View in My Appointments';

        const returnView = state.role === 'doctor'
          ? 'doctor-dashboard'
          : state.role === 'frontdesk'
          ? 'frontdesk-queue'
          : state.role === 'administrator'
          ? 'admin-overview'
          : 'my-appointments';

        return `
        <div class="text-center py-6">
          <div class="w-16 h-16 mx-auto rounded-full bg-green-50 text-success flex items-center justify-center mb-4">${icon('check', 'w-8 h-8')}</div>
          <h2 class="text-2xl font-bold text-navy">Appointment Confirmed!</h2>
          <p class="text-text-secondary mt-1">Your reservation is verified and written to the hospital database.</p>
          
          <div class="mt-6 bg-bg-soft rounded-xl p-6 text-left max-w-md mx-auto space-y-3">
            <div class="flex justify-between"><span class="text-sm text-text-secondary">Appointment ID</span><span class="text-sm font-bold text-primary">${appt.id}</span></div>
            <div class="flex justify-between"><span class="text-sm text-text-secondary">Doctor</span><span class="text-sm font-medium text-navy">${appt.doctor_name || appt.doctor_id}</span></div>
            <div class="flex justify-between"><span class="text-sm text-text-secondary">Department</span><span class="text-sm font-medium text-navy">${appt.department_name || appt.department_id}</span></div>
            <div class="flex justify-between"><span class="text-sm text-text-secondary">Date & Time</span><span class="text-sm font-medium text-navy">${fmtDate(appt.appointment_date)} at ${appt.appointment_time}</span></div>
            <div class="flex justify-between items-center"><span class="text-sm text-text-secondary">Status</span>${statusBadge(appt.status)}</div>
            <div class="flex justify-between items-center pt-2 border-t border-borders"><span class="text-sm text-text-secondary">Notification</span>${notifBadge('sent')}</div>
          </div>

          <div class="mt-8 flex flex-col sm:flex-row gap-3 justify-center">
            <button onclick="nav('${returnView}')" class="px-6 py-2.5 bg-primary text-white rounded-lg font-medium hover:bg-primary-dark shadow-card">${returnLabel}</button>
            <button onclick="window.print()" class="px-6 py-2.5 border border-borders text-navy rounded-lg font-medium hover:bg-bg-soft flex items-center justify-center gap-2">${icon('printer', 'w-4 h-4')} Print Summary</button>
          </div>
        </div>`;
      }
    }

    async function selectDept(id) {
      state.booking.deptId = id;
      state.booking.doctorId = null;
      render();
    }

    async function selectDoctor(id) {
      state.booking.doctorId = id;
      await fetchSlotsForBooking();
      render();
    }

    async function changeBookingDate(d) {
      state.booking.date = d;
      state.booking.time = null;
      await fetchSlotsForBooking();
      render();
    }

    function selectTime(t) {
      state.booking.time = t;
      render();
    }

    function savePatientDetails() {
      state.booking.patient = {
        name: $('#p-name').value.trim(),
        phone: $('#p-phone').value.trim(),
        email: $('#p-email').value.trim(),
        age: parseInt($('#p-age').value, 10),
        gender: $('#p-gender').value
      };
      state.booking.type = $('#p-type').value;
      state.booking.note = $('#p-notes').value.trim();
      nextStep();
    }

    function nextStep() {
      if (state.booking.step < 6) {
        state.booking.step++;
        render();
      }
    }

    function prevStep() {
      if (state.booking.step > 1) {
        state.booking.step--;
        render();
      }
    }

    async function executeAtomicBooking() {
      const btn = $('#confirm-booking-btn');
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = `${icon('loader-2', 'w-4 h-4 animate-spin')} Processing Transaction...`;
      }

      const b = state.booking;
      try {
        const payload = {
          patient_name: b.patient.name,
          patient_email: b.patient.email,
          patient_phone: b.patient.phone,
          doctor_id: b.doctorId,
          department_id: b.deptId,
          appointment_date: b.date,
          appointment_time: b.time,
          type: b.type,
          notes: b.note
        };

        const res = await api.post('/api/appointments', payload);
        state.booking.confirmedAppointment = res.appointment;
        state.booking.step = 6;

        // Establish or preserve patient session if user was a guest or patient
        localStorage.removeItem('mediassist_signed_out');
        if (!state.user || state.role === 'patient') {
          state.role = 'patient';
          state.user = {
            id: state.user?.id || res.appointment.patient_id || ('u-patient-' + Date.now()),
            name: b.patient.name,
            email: b.patient.email,
            phone: b.patient.phone,
            role: 'patient'
          };
          saveSession();
        }

        toast(`Appointment created with ID: ${res.appointment.id}`);
        refreshAppointments();
        render();
      } catch (err) {
        if (err.conflict) {
          // Double-booking rejected
          openModal(
            'Slot Already Booked',
            `<div class="space-y-3">
              <div class="p-3 bg-red-50 text-error rounded-lg text-sm border border-red-200">
                <strong>Booking Rejected:</strong> ${err.error || 'The requested doctor/date/time slot is already reserved.'}
              </div>
              <p class="text-sm text-text-secondary">Another patient has already secured this time. Please select an alternative slot below:</p>
              <div class="grid grid-cols-3 gap-2 mt-3">
                ${(err.details?.alternative_slots || []).map(s => `<button onclick="closeModal(); selectTime('${s}');" class="slot-available p-2 rounded-lg text-xs font-semibold">${s}</button>`).join('')}
              </div>
            </div>`,
            `<button onclick="closeModal(); state.booking.step = 3; render();" class="px-4 py-2 bg-primary text-white text-xs font-semibold rounded-lg">Pick Different Time</button>`
          );
        } else {
          toast(err.error || 'Failed to create appointment.', 'error');
        }
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = `${icon('check-circle', 'w-4 h-4')} Confirm Appointment`;
        }
      }
    }

    /* =========================================================
       PATIENT DASHBOARD & APPOINTMENTS
       ========================================================= */
    function patientDashboard() {
      const activeAppts = state.appointments.filter(a => a.status === 'confirmed' || a.status === 'rescheduled');
      const completedAppts = state.appointments.filter(a => a.status === 'completed');

      const kpis = [
        ['Upcoming Visits', activeAppts.length.toString(), 'Confirmed bookings', 'calendar-clock'],
        ['Completed Visits', completedAppts.length.toString(), 'Total consultations', 'check-circle'],
        ['Pending Tests', '0', 'Medical reviews', 'clipboard'],
        ['Verified Records', '1', 'Patient profile', 'shield-check']
      ];

      return dashboardLayout('patient', `Welcome back, ${(state.user?.name || 'Patient').split(' ')[0]}`, 'Here is your verified healthcare status.', `
      <div class="space-y-6">
        <div class="bg-gradient-to-r from-primary to-primary-dark rounded-2xl p-6 sm:p-8 text-white shadow-float">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h2 class="text-2xl font-bold">Need a doctor consultation?</h2>
              <p class="text-white/80 mt-1">Book directly with specialists or consult MediAssist AI.</p>
            </div>
            <div class="flex flex-wrap gap-2.5">
              <button onclick="nav('booking')" class="px-5 py-2.5 bg-white text-primary font-semibold rounded-xl hover:bg-mint transition flex items-center gap-2 shadow-card">${icon('calendar-plus', 'w-4 h-4')} Book Appointment</button>
              <button onclick="nav('ai-assistant')" class="px-4 py-2.5 bg-navy/30 text-white font-semibold rounded-xl hover:bg-navy/40 transition flex items-center gap-2">${icon('message-square', 'w-4 h-4')} Chat with AI</button>
              <button onclick="openVoiceAssistant()" class="px-4 py-2.5 bg-white/20 text-white font-semibold rounded-xl hover:bg-white/30 transition flex items-center gap-2">${icon('mic', 'w-4 h-4')} Voice Agent</button>
            </div>
          </div>
        </div>

        <div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4">
          ${kpis.map(([l, v, s, i]) => kpi(l, v, s, i)).join('')}
        </div>

        <div class="grid lg:grid-cols-3 gap-6">
          <div class="lg:col-span-2 space-y-6">
            <div class="bg-white rounded-xl border border-borders shadow-card p-5">
              <div class="flex items-center justify-between mb-4"><h3 class="font-bold text-navy">Upcoming Appointments</h3><button onclick="nav('my-appointments')" class="text-sm text-primary font-medium hover:underline">View all</button></div>
              ${activeAppts.length ? activeAppts.map(a => appointmentCard(a)).join('') : emptyState('No upcoming appointments', 'Book your first clinical consultation today.')}
            </div>
          </div>
          <div class="space-y-6">
            <div class="bg-white rounded-xl border border-borders shadow-card p-5">
              <h3 class="font-bold text-navy mb-4">Recommended Doctors</h3>
              <div class="space-y-3">
                ${state.doctors.slice(0, 3).map(d => `<div class="flex gap-3 items-center p-3 rounded-lg hover:bg-bg-soft cursor-pointer" onclick="viewDoctor('${d.id}')"><img src="${d.image_url || d.image}" class="w-10 h-10 rounded-lg object-cover"><div class="flex-1 min-w-0"><p class="text-sm font-semibold truncate">${d.name}</p><p class="text-xs text-text-secondary">${d.specialty}</p></div>${icon('chevron-right', 'w-4 h-4 text-text-secondary')}</div>`).join('')}
              </div>
            </div>
          </div>
        </div>
      </div>`);
    }

    function appointmentCard(a) {
      const doc = doctorById(a.doctor_id);
      return `
      <div class="flex flex-col sm:flex-row gap-4 p-4 border border-borders rounded-xl bg-bg-soft/50 mb-3">
        <img src="${a.doctor_image || doc.image_url || doc.image}" class="w-16 h-16 rounded-lg object-cover border border-borders flex-shrink-0">
        <div class="flex-1 min-w-0">
          <div class="flex flex-wrap items-center gap-2 mb-1">
            <h4 class="font-semibold text-navy">${a.doctor_name || doc.name}</h4>
            ${statusBadge(a.status)}
            ${notifBadge(a.notification_status || 'sent')}
          </div>
          <p class="text-sm text-primary font-medium">${a.department_name || a.department_id}</p>
          <p class="text-xs text-text-secondary mt-1">${fmtDate(a.appointment_date)} • ${a.appointment_time}</p>
          <p class="text-xs text-text-secondary">ID: <strong>${a.id}</strong></p>
        </div>
        <div class="flex sm:flex-col gap-2 justify-end">
          <button onclick="viewApptDetail('${a.id}')" class="px-3 py-1.5 text-xs font-medium text-navy border border-borders rounded-lg hover:bg-white">Details</button>
          ${a.status !== 'cancelled' ? `
            <button onclick="openReschedule('${a.id}')" class="px-3 py-1.5 text-xs font-medium text-primary border border-primary/20 rounded-lg hover:bg-mint">Reschedule</button>
            <button onclick="openCancel('${a.id}')" class="px-3 py-1.5 text-xs font-medium text-error border border-error/20 rounded-lg hover:bg-red-50">Cancel</button>
          ` : ''}
        </div>
      </div>`;
    }

    function myAppointments() {
      const tab = state.appointmentsFilter.tab;
      const filtered = state.appointments.filter(a => {
        if (tab === 'confirmed') return a.status === 'confirmed' || a.status === 'rescheduled';
        if (tab === 'completed') return a.status === 'completed';
        if (tab === 'cancelled') return a.status === 'cancelled';
        return true;
      });

      return dashboardLayout('patient', 'My Appointments', 'Manage your clinical appointments & live status.', `
      <div class="bg-white rounded-xl border border-borders shadow-card p-5">

    async function viewApptDetail(id) {
      try {
        const a = await api.get(`/api/appointments/${id}`);
        openModal('Appointment Details', `
          <div class="space-y-3 text-sm">

            <div class="flex justify-between"><span class="text-text-secondary">Doctor</span><span class="font-medium">${a.doctor_name} (${a.doctor_specialty})</span></div>
            <div class="flex justify-between"><span class="text-text-secondary">Department</span><span class="font-medium">${a.department_name}</span></div>
            <div class="flex justify-between"><span class="text-text-secondary">Date & Time</span><span class="font-medium">${fmtDate(a.appointment_date)} at ${a.appointment_time}</span></div>
            <div class="flex justify-between"><span class="text-text-secondary">Status</span>${statusBadge(a.status)}</div>
            <div class="flex justify-between"><span class="text-text-secondary">Patient</span><span class="font-medium">${a.patient_name} (${a.patient_email})</span></div>

                <div class="p-2 bg-bg-soft rounded text-xs flex justify-between">
                  <span>${n.event_type} (${n.channel})</span>

              `).join('') || '<span class="text-xs text-text-secondary">Notification delivered.</span>'}
            </div>
          </div>

    function openCancel(id) {
      openModal(
        'Cancel Appointment',
        `<p class="text-sm text-text-secondary">Are you sure you want to cancel appointment <strong>${id}</strong>? The reserved slot will be freed immediately for other patients.</p>`,
        `<button onclick="closeModal()" class="px-4 py-2 text-sm font-medium text-text-secondary hover:text-navy">Keep Appointment</button>
         <button onclick="executeCancel('${id}')" class="px-4 py-2 text-sm font-medium text-white bg-error rounded-lg hover:bg-red-700">Cancel Appointment</button>`
      );
    }

    async function executeCancel(id) {
      try {
        await api.post(`/api/appointments/${id}/cancel`, { reason: 'Cancelled by patient' });
        closeModal();
        await refreshAppointments();
        render();
        toast('Appointment cancelled and slot released.', 'warning');
      } catch (err) {
        toast('Cancellation failed.', 'error');
      }
    }

    async function openReschedule(id) {
      const appt = state.appointments.find(a => a.id === id);
      if (!appt) return;
      const today = new Date().toISOString().split('T')[0];

      openModal(
        'Reschedule Appointment',
        `<div class="space-y-4">
          <p class="text-sm text-text-secondary">Select a new date and time for <strong>${appt.id}</strong>:</p>
          <div>
            <label class="block text-xs font-medium mb-1">New Date</label>
            <input type="date" id="resched-date" value="${today}" min="${today}" class="w-full px-3 py-2 border border-borders rounded-lg text-sm">
          </div>
          <div>
            <label class="block text-xs font-medium mb-1">Select New Time Slot</label>
            <div class="grid grid-cols-3 gap-2">
              ${['09:00 AM', '09:30 AM', '10:00 AM', '10:30 AM', '11:00 AM', '02:00 PM', '02:30 PM', '03:00 PM', '03:30 PM'].map(s => `
                <button type="button" onclick="$$('.resched-slot-btn').forEach(b=>b.classList.remove('slot-selected')); this.classList.add('slot-selected'); window.selectedReschedSlot='${s}';" class="resched-slot-btn slot-available py-2 rounded-lg text-xs font-medium border">${s}</button>
              `).join('')}
            </div>
          </div>
        </div>`,
        `<button onclick="closeModal()" class="px-4 py-2 text-sm font-medium text-text-secondary hover:text-navy">Close</button>
         <button onclick="executeReschedule('${id}')" class="px-4 py-2 text-sm font-medium text-white bg-primary rounded-lg hover:bg-primary-dark">Save Changes</button>`
      );
    }

    async function executeReschedule(id) {
      const date = $('#resched-date')?.value;
      const time = window.selectedReschedSlot;
      if (!date || !time) {
        toast('Please pick both date and time slot.', 'warning');
        return;
      }

      try {
        await api.patch(`/api/appointments/${id}/reschedule`, { new_date: date, new_time: time });
        closeModal();
        await refreshAppointments();
        render();
        toast('Appointment successfully rescheduled.');
      } catch (err) {
        toast(err.error || 'Reschedule conflict. Slot already taken.', 'error');
      }
    }

    /* =========================================================
       FRONTDESK PORTAL (QUEUE & WALK-IN REGISTRATION)

        <div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4">
          ${kpi('Total Today', q.total_today.toString(), 'Scheduled arrivals', 'users')}
          ${kpi('Waiting in Reception', q.waiting.length.toString(), 'Needs check-in', 'clock', 'warning')}
          ${kpi('Checked-In', q.checked_in.length.toString(), 'Ready for doctor', 'check-circle', 'primary')}
          ${kpi('In Consultation', q.in_consultation.length.toString(), 'With specialist', 'activity', 'success')}

            <h3 class="font-bold text-navy">Today's Patient Queue</h3>
            <button onclick="nav('frontdesk-walkin')" class="px-4 py-2 bg-primary text-white text-xs font-semibold rounded-lg hover:bg-primary-dark flex items-center gap-1.5">${icon('plus', 'w-4 h-4')} New Walk-In Patient</button>
          </div>

          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead><tr class="border-b border-borders text-left text-text-secondary"><th class="pb-3">ID</th><th class="pb-3">Patient</th><th class="pb-3">Doctor</th><th class="pb-3">Time</th><th class="pb-3">Status</th><th class="pb-3 text-right">Actions</th></tr></thead>
              <tbody class="divide-y divide-borders">
                ${state.appointments.map(a => `
                  <tr class="hover:bg-bg-soft/50">
                    <td class="py-3 font-semibold text-primary">${a.id}</td>
                    <td class="py-3 font-medium text-navy">${a.patient_name}<br><span class="text-xs text-text-secondary">${a.patient_phone}</span></td>
                    <td class="py-3 text-text-secondary">${a.doctor_name || a.doctor_id}</td>
                    <td class="py-3 font-medium text-navy">${a.appointment_time}</td>
                    <td class="py-3">${statusBadge(a.status)}</td>

                      ${a.status === 'in_consultation' ? `<button onclick="updateApptStatus('${a.id}','completed')" class="px-3 py-1 bg-success text-white text-xs font-semibold rounded-lg hover:bg-green-700">Complete</button>` : ''}
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      </div>`);
    }

    async function checkInPatient(id) {
      try {
        await api.post(`/api/frontdesk/checkin/${id}`);
        toast(`Patient checked in.`);
        state.frontdeskQueue = await api.get('/api/frontdesk/queue');
        await refreshAppointments();
        render();
      } catch (e) {
        toast('Check-in failed.', 'error');
      }
    }

    async function updateApptStatus(id, status) {
      try {
        await api.patch(`/api/appointments/${id}/status`, { status });
        toast(`Status updated to ${status}.`);
        state.frontdeskQueue = await api.get('/api/frontdesk/queue');
        await refreshAppointments();
        render();
      } catch (e) {
        toast('Status update failed.', 'error');
      }
    }

    function frontdeskWalkin() {
      const today = new Date().toISOString().split('T')[0];
      return dashboardLayout('frontdesk', 'Register Walk-In Patient', 'Fast on-premise booking desk.', `
      <div class="bg-white rounded-xl border border-borders shadow-card p-6 max-w-2xl mx-auto">
        <h3 class="font-bold text-navy mb-4">Walk-In Patient Registration</h3>
        <form onsubmit="event.preventDefault(); executeWalkin();" class="space-y-4">

            </div>
            <div><label class="block text-xs font-medium mb-1">Doctor</label>
              <select id="w-doc" class="w-full px-3 py-2 border border-borders rounded-lg text-sm">
                ${state.doctors.map(d => `<option value="${d.id}">${d.name} (${d.specialty})</option>`).join('')}
              </select>
            </div>
            <div><label class="block text-xs font-medium mb-1">Date</label><input type="date" id="w-date" value="${today}" class="w-full px-3 py-2 border border-borders rounded-lg text-sm"></div>

          <div><label class="block text-xs font-medium mb-1">Time Slot</label>
            <select id="w-time" class="w-full px-3 py-2 border border-borders rounded-lg text-sm">
              ${['09:00 AM', '09:30 AM', '10:00 AM', '10:30 AM', '11:00 AM', '11:30 AM', '02:00 PM', '02:30 PM', '03:00 PM', '03:30 PM', '04:00 PM'].map(s => `<option>${s}</option>`).join('')}
            </select>
          </div>
          <div class="pt-4 flex justify-end gap-3">
            <button type="button" onclick="nav('frontdesk-queue')" class="px-4 py-2 border border-borders rounded-lg text-sm">Cancel</button>

          </div>
        </form>
      </div>`);
    }

    async function executeWalkin() {
      try {
        const payload = {
          patient_name: $('#w-name').value.trim(),
          patient_phone: $('#w-phone').value.trim(),
          patient_email: $('#w-email').value.trim(),
          department_id: $('#w-dept').value,
          doctor_id: $('#w-doc').value,
          appointment_date: $('#w-date').value,
          appointment_time: $('#w-time').value
        };

        const res = await api.post('/api/frontdesk/walkin', payload);
        toast(`Walk-in booked: ID ${res.appointment.id}`);
        await refreshAppointments();
        nav('frontdesk-queue');
      } catch (err) {
        toast(err.error || 'Conflict: Slot already occupied.', 'error');
      }
    }

    /* =========================================================
       DOCTOR & ADMIN PORTALS
       ========================================================= */

      const myAppts = state.appointments.filter(a => a.doctor_id === (state.user?.doctor_id || 'dr-mitchell'));
      return dashboardLayout('doctor', 'Doctor Dashboard', 'Consultation management for Dr. Sarah Mitchell', `
      <div class="space-y-6">
        <div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4">
          ${kpi("Today's Consultations", myAppts.length.toString(), 'Patient queue', 'calendar-check')}
          ${kpi('Completed Visits', '12', 'This week', 'check-circle')}
          ${kpi('Slot Capacity', '18', 'Configured slots', 'clock')}
          ${kpi('Patient Reviews', '4.9 ★', '214 ratings', 'star')}
        </div>
        <div class="bg-white rounded-xl border border-borders shadow-card p-5">
          <h3 class="font-bold text-navy mb-4">My Patient Appointments</h3>
          ${myAppts.length ? myAppts.map(a => appointmentCard(a)).join('') : emptyState('No appointments scheduled', 'No bookings found for your profile.')}
        </div>
      </div>`);
    }

    function doctorAppointments() { return doctorDashboard(); }
    function doctorSchedule() { return doctorDashboard(); }
    function doctorAvailability() { return doctorDashboard(); }
    function doctorProfileEdit() { return doctorDashboard(); }

    async function adminOverview() {
      if (!state.adminOverviewData) {
        state.adminOverviewData = await api.get('/api/admin/overview');
      }
      const data = state.adminOverviewData;

      return dashboardLayout('administrator', 'Hospital Overview & Analytics', 'MediAssist Medical Center operational metrics.', `
      <div class="space-y-6">
        <div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4">
          ${kpi('Total Bookings', data.kpis.total_appointments.toString(), 'All records', 'calendar-check')}

            <div class="space-y-3">
              ${(data.department_distribution || []).map(d => `
                <div>
                  <div class="flex justify-between text-xs mb-1 font-medium"><span>${d.name}</span><span>${d.appointment_count} bookings</span></div>
                  <div class="w-full h-2 bg-bg-soft rounded-full overflow-hidden">

                  <span class="font-bold text-primary">${s.count}</span>

              `).join('')}

        <div class="bg-white rounded-xl border border-borders shadow-card p-5">

          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead><tr class="border-b border-borders text-left text-text-secondary"><th class="pb-3">ID</th><th class="pb-3">Patient</th><th class="pb-3">Doctor</th><th class="pb-3">Date/Time</th><th class="pb-3">Status</th></tr></thead>
              <tbody class="divide-y divide-borders">
                ${state.appointments.map(a => `
                  <tr class="hover:bg-bg-soft/50">
                    <td class="py-3 font-semibold text-primary">${a.id}</td>
                    <td class="py-3 font-medium text-navy">${a.patient_name}</td>
                    <td class="py-3 text-text-secondary">${a.doctor_name || a.doctor_id}</td>
                    <td class="py-3 text-text-secondary">${a.appointment_date} at ${a.appointment_time}</td>

        </div>
      </div>`);

    function adminAppointments() { return adminOverview(); }
    function adminDoctors() { return adminOverview(); }
    function adminDepartments() { return adminOverview(); }
    function adminPatients() { return adminOverview(); }
    function adminAnalytics() { return adminOverview(); }
    function adminSettings() { return settings(); }

    function emptyState(title, desc) {
      return `<div class="text-center py-12"><div class="w-14 h-14 mx-auto rounded-full bg-bg-soft text-text-secondary flex items-center justify-center mb-3">${icon('inbox', 'w-6 h-6')}</div><h3 class="font-semibold text-navy">${title}</h3><p class="text-sm text-text-secondary mt-1">${desc}</p></div>`;
    }

    /* =========================================================
       ROUTER & INITIALIZATION
       ========================================================= */
    const views = {
      landing,
      signin,
      'ai-assistant': aiAssistant,
      'find-doctors': findDoctors,
      'doctor-profile': doctorProfile,
      booking,
      'patient-dashboard': patientDashboard,
      'my-appointments': myAppointments,
      'medical-profile': medicalProfile,
      settings,
      'frontdesk-queue': frontdeskQueue,
      'frontdesk-walkin': frontdeskWalkin,
      'doctor-dashboard': doctorDashboard,
      'doctor-appointments': doctorAppointments,
      'doctor-schedule': doctorSchedule,
      'doctor-availability': doctorAvailability,
      'doctor-profile-edit': doctorProfileEdit,
      'admin-overview': adminOverview,
      'admin-appointments': adminAppointments,
      'admin-doctors': adminDoctors,
      'admin-departments': adminDepartments,
      'admin-patients': adminPatients,
      'admin-analytics': adminAnalytics,
      'admin-settings': adminSettings
    };

    async function render() {
      const app = $('#app');
      const renderFn = views[state.view] || landing;
      const content = await renderFn();
      if (typeof content === 'string') {
        app.innerHTML = content;
      }
      lucide.createIcons();
      if (state.view === 'ai-assistant') {
        initChat();
      }
    }

    window.addEventListener('DOMContentLoaded', async () => {
      loadSession();
      await loadInitialData();
      render();
      window.addEventListener('hashchange', () => {
        const hash = window.location.hash.replace('#', '');
        if (hash && hash !== state.view && views[hash]) {
          state.view = hash;
          render();
        }
      });
    });
  </script>
</body>
